name: Rust Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  run-tests-and-coverage:
    uses: fermi-ad/.github/.github/workflows/rust-integration.yaml@v1
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
    with:
      # The "queries.rs" files just contain static constants, which are inlined at compile time. Because of this, the coverage reporter
      # shows the source files as lacking coverage.
      # Similarly, "services/mod.rs" just contains the declarations of the services submodules, and is also inlined.
      coverage-exclude: "|queries.rs|services/mod.rs" 
      pull-git-submodules: true
      references-internal-git-repo: true
