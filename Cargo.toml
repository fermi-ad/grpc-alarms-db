[package]
name = "grpc-alarms-db"
version = "0.3.2"
edition = "2024"

[dependencies]
chrono = { version = "0.4.44", features = ["alloc", "serde"] }
prost = "0.14.3"
prost-types = "0.14.3"
rust-db-lib = { git = "https://github.com/fermi-ad/rust-db-lib.git", tag = "v5.0.0" }
rust-env-var-lib = { git = "https://github.com/fermi-ad/rust-env-var-lib.git", tag = "v1.2.0" }
tokio = { version = "1.50.0", features = ["rt-multi-thread", "macros", "rt"] }
tonic = "0.14.5"
tonic-health = "0.14.5"
tonic-prost = "0.14.5"
tracing = { version = "0.1.44", features = ["log"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[build-dependencies]
tonic-prost-build = "0.14.5"
protoc-bin-vendored = "3.2.0"

[dev-dependencies]
rust-db-lib = { git = "https://github.com/fermi-ad/rust-db-lib.git", tag = "v5.0.0", features = ["testing-utils"] }


[profile.release]
lto = true

[workspace.lints.rust]
ambiguous_negative_literals = "warn"
let_underscore_drop = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
unit_bindings = "warn"
unnameable_types = "warn"
unreachable_pub = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
manual_assert = "warn"
allow_attributes_without_reason = "warn"
collection_is_never_read = "warn"
comparison_chain = "warn"
elidable_lifetime_names = "warn"
empty_drop = "warn"
enum_glob_use = "warn"
equatable_if_let = "warn"
error_impl_error = "warn"
exit = "deny"
if_not_else = "warn"
if_then_some_else_none = "warn"
impl_trait_in_params = "warn"
