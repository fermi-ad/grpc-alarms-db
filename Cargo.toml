[package]
name = "grpc-alarms-db"
version = "0.3.4"
edition = "2024"

[dependencies]
chrono = "0.4"
prost = "0.14"
rust-db-lib = { git = "https://github.com/fermi-ad/rust-db-lib.git", tag = "v6.0.0" }
rust-env-var-lib = { git = "https://github.com/fermi-ad/rust-env-var-lib.git", tag = "v1.2.0" }
rust-grpc-lib = { git = "https://github.com/fermi-ad/rust-grpc-lib.git", tag = "v3.1.0" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "rt"] }
tonic = "0.14"
tonic-health = "0.14"
tonic-prost = "0.14"
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
rust-grpc-lib = { git = "https://github.com/fermi-ad/rust-grpc-lib.git", tag = "v3.1.0", features = ["build"] }

[dev-dependencies]
rust-db-lib = { git = "https://github.com/fermi-ad/rust-db-lib.git", tag = "v6.0.0", features = ["testing-utils"] }

# Release profile tuned for a single-binary microservice deployed in a container.
#
# lto = true          — link-time optimisation across all crates; reduces binary size and improves
#                       inlining at the cost of longer link times (acceptable in CI, not in dev).
# codegen-units = 1   — disables parallel code generation; allows LLVM to optimise across the
#                       entire crate at once, complementing LTO.
# opt-level = 3       — maximum optimisation; the default for release is already 3, stated
#                       explicitly here for clarity.
# strip = "symbols"   — removes debug symbols from the final binary, reducing image size.
#                       Note: core dumps from production will not contain symbol information.
#                       If post-mortem debugging is ever needed, build without this flag.
# panic = "abort"     — terminates the process immediately on panic rather than unwinding the
#                       stack. This means destructors (Drop impls) will NOT run on panic.
#                       Acceptable here because the service has no resources that require
#                       graceful cleanup on panic (the OS reclaims file handles, sockets, etc.).
#                       Produces a smaller binary and avoids the unwinding machinery.
[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = "symbols"
panic = "abort"

[workspace.lints.rust]
ambiguous_negative_literals = "warn"
let_underscore_drop = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
unit_bindings = "warn"
unnameable_types = "warn"
unreachable_pub = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
manual_assert = "warn"
allow_attributes_without_reason = "warn"
collection_is_never_read = "warn"
comparison_chain = "warn"
elidable_lifetime_names = "warn"
empty_drop = "warn"
enum_glob_use = "warn"
equatable_if_let = "warn"
error_impl_error = "warn"
exit = "deny"
if_not_else = "warn"
if_then_some_else_none = "warn"
impl_trait_in_params = "warn"
